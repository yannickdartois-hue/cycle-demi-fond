<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#C8402A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Demi-fond">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-32.png">
<title>Cycle demi-fond</title>
<style>
/* ===== Écran de cours du cycle de demi-fond =====
   Même famille que les cycles de volley-ball et de step : sol clair, encre du tableau d'affichage, tracé de l'activité.
   Deux polices embarquées pour le hors ligne : Archivo (titres, chiffres) et Atkinson Hyperlegible (texte). */
@font-face{font-family:"Archivo";src:url(polices/archivo.woff2) format("woff2");font-weight:100 900;font-stretch:62% 125%;font-display:swap}
@font-face{font-family:"Atkinson";src:url(polices/atkinson-400.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Atkinson";src:url(polices/atkinson-700.woff2) format("woff2");font-weight:700;font-display:swap}
:root{
  --sol:#ECEFEE; --craie:#FFFFFF; --encre:#172033; --repere:#5A6475; --trait:#D5DBDD;
  --ligne:#C8402A; --ligne-fonce:#8C2A1A; --ligne-pale:#FBE6E1;
  --vert:#1D6B3A; --vert-pale:#E6F3EA; --alerte:#B42318; --alerte-pale:#FDE8E6;
  --facile:#2F6FB0; --facile-pale:#EAF2FB; --dur:#B4441C; --dur-pale:#FCEDE6;
  --d:"Archivo","Arial Narrow",Arial,sans-serif; --t:"Atkinson","Segoe UI",Roboto,Arial,sans-serif;
  --sur-encre:#FFFFFF; --fait:#9AA3AE;
  --c-s:#0F766E; --c-s-pale:#DDF3F0; --c-t:#1F4FA8; --c-t-pale:#E3EBF8; --sur-niv:#FFFFFF;
}
body.niv-s{--niv:var(--c-s);--niv-pale:var(--c-s-pale)}
body.niv-t{--niv:var(--c-t);--niv-pale:var(--c-t-pale)}
/* Mode sombre : pour préparer le soir. Au gymnase, le mode clair reste le plus lisible. */
@media (prefers-color-scheme:dark){:root{
  --sol:#11161D; --craie:#1B222C; --encre:#E9EEF3; --repere:#9AA5B3; --trait:#323C49; --sur-encre:#11161D; --fait:#5B6573;
  --ligne:#F2785F; --ligne-fonce:#F8A795; --ligne-pale:#3A1A14;
  --vert:#6FD39F; --vert-pale:#15301F; --alerte:#FF8A80; --alerte-pale:#3A1A18;
  --facile:#7FB0E8; --facile-pale:#162638; --dur:#F29470; --dur-pale:#3A2018;
  --c-s:#5EEAD4; --c-s-pale:#123A36; --c-t:#8FB4F2; --c-t-pale:#1B2A44; --sur-niv:#11161D; color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--sol);color:var(--encre);font:18px/1.4 var(--t);-webkit-font-smoothing:antialiased;min-height:100vh;overscroll-behavior-y:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid var(--ligne);outline-offset:2px}
a{color:var(--encre)}
.disp{font-family:var(--d);font-weight:800;font-stretch:72%}
.num{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}

/* ---- barre haute ---- */
.barre{display:flex;align-items:center;gap:12px;padding:10px 18px;padding-top:max(10px,env(safe-area-inset-top));background:var(--craie)}
.barre img{width:36px;height:36px;border-radius:9px;flex:none}
.barre .app{font:700 16px/1.15 var(--t);flex:none}
.barre .app small{display:block;font-weight:400;color:var(--repere);font-size:14px}
.barre .titre{flex:1;min-width:0;font:800 21px/1.1 var(--d);font-stretch:74%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:6px}
.bt{text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:0 16px;border-radius:12px;font:700 16px var(--t);white-space:nowrap}
.bt.noir{background:var(--encre);color:var(--sur-encre)}
.bt.bord{border:2px solid var(--encre)}
.bt.clair{background:var(--sol)}
.bt.jaune{background:var(--ligne-pale);color:var(--ligne-fonce)}
.trace{height:10px;background:var(--ligne)}
/* Le niveau : un bandeau à sa couleur, sous le tracé de l'activité, et une pastille dans la barre */
.niveau{display:flex;align-items:center;gap:12px;padding:8px 18px;background:var(--niv);color:var(--sur-niv)}
.niveau .nn{font:800 19px/1 var(--d);font-stretch:80%;letter-spacing:.04em;flex:none}
.niveau .bascule{flex:none;font:700 14px var(--t);padding:0 12px;border-radius:9px;border:1.5px solid currentColor;color:inherit;min-height:40px}
/* Les séances du cycle, toujours visibles : un toucher pour en afficher une */
.strip{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0;padding:2px 0;-webkit-overflow-scrolling:touch}
.strip::-webkit-scrollbar{display:none}
.strip button{flex:none;min-width:48px;height:42px;padding:0 10px;border-radius:10px;font:800 19px/1 var(--d);font-stretch:74%;color:inherit;border:1.5px solid color-mix(in srgb,currentColor 45%,transparent)}
.strip button.fait{opacity:.6;border-style:dashed}
.strip button.jour{box-shadow:inset 0 -4px 0 var(--ligne)}
.strip button.ici{background:var(--sur-niv);color:var(--niv);border-color:var(--sur-niv);opacity:1}
.strip button.eval{border-style:dotted}
@media (max-width:560px){.niveau .nn{display:none}}
.pastille-niv{display:inline-grid;place-items:center;min-width:54px;height:40px;padding:0 10px;border-radius:10px;background:var(--niv);color:var(--sur-niv);font:800 22px/1 var(--d);font-stretch:72%;flex:none}
.carte .etiq .nv{display:inline-block;margin-right:8px;padding:1px 7px;border-radius:6px;background:var(--niv-pale);color:var(--niv);font:700 13px var(--t)}

/* ---- déroulé peint ---- */
.deroule{position:relative;padding:34px 18px 0}
.ligneT{display:flex;gap:4px;height:16px}
.ligneT button{border-radius:3px;background:var(--trait);min-width:54px}
.ligneT .fait{background:var(--fait)}
.ligneT .zap{background:repeating-linear-gradient(135deg,var(--trait) 0 6px,transparent 6px 11px)}
.ligneT .now{background:var(--ligne)}
.ligneT .vu{outline:3px solid var(--encre);outline-offset:2px}
.curseur{position:absolute;top:4px;transform:translateX(calc(var(--k,50) * -1%));font:800 16px var(--d);font-stretch:80%;background:var(--encre);color:var(--sur-encre);padding:3px 9px;border-radius:7px;white-space:nowrap;pointer-events:none}
.curseur::after{content:"";position:absolute;left:calc(var(--k,50) * 1%);top:100%;margin-left:-1.5px;width:3px;height:22px;background:var(--encre)}
.blocs{display:flex;gap:4px;margin-top:8px}
.blocs button{min-width:54px;text-align:left;font-size:14px;color:var(--repere);line-height:1.2;padding:2px 0}
.blocs b{display:block;font:800 16px var(--d);font-stretch:80%;color:var(--encre);white-space:nowrap}
.blocs .now b{color:var(--ligne-fonce)}
.blocs .zap{text-decoration:line-through}
.blocs span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:normal;word-break:normal;hyphens:manual;padding-right:4px}
.modif{display:inline-block;margin-left:4px;font:700 12px var(--t);vertical-align:2px;padding:1px 6px;border-radius:5px;background:var(--ligne-pale);color:var(--ligne-fonce)}
.modif.moins{background:var(--sol);color:var(--repere)}

/* ---- zone principale ---- */
.zone{display:grid;grid-template-columns:minmax(0,1.18fr) minmax(0,.82fr);gap:16px;padding:16px 18px 110px}
@media (max-width:900px){.zone{grid-template-columns:minmax(0,1fr)}}
.carte{background:var(--craie);border-radius:22px;padding:18px 22px 20px;border-left:12px solid var(--ligne);min-width:0}
.carte.attente{border-left-color:var(--trait)}
.carte.apercu{border-left-color:var(--repere)}
.etiq{font:700 15px var(--t);color:var(--ligne-fonce);margin:0 0 2px}
.carte.attente .etiq,.carte.apercu .etiq{color:var(--repere)}
.carte h1{margin:0;font:800 clamp(30px,3.6vw,38px)/1 var(--d);font-stretch:72%;text-wrap:balance}
.quand{margin:6px 0 0;color:var(--repere);font-size:16px}
.tag{display:inline-block;margin-left:6px;vertical-align:1px;font:700 13px var(--t);padding:2px 8px;border-radius:6px;background:var(--ligne-pale);color:var(--ligne-fonce)}
.tag.moins{background:var(--sol);color:var(--repere)}
.reglage{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 12px}
.reglage .bt{min-height:52px;font-size:17px;padding:0 13px}
.chrono{display:flex;align-items:baseline;gap:6px;padding:0 14px;min-height:52px;border-radius:14px;border:2px solid var(--trait)}
.chrono span{font:800 40px/50px var(--d);font-stretch:70%}
.chrono small{font:700 13px var(--t);color:var(--repere)}
.chrono.fini{border-color:var(--dur);color:var(--dur)}
.chrono.fini small{color:var(--dur)}
.chrono.pause span{opacity:.45}
.reglage .suiv{margin-left:auto}
h2.rub{margin:16px 0 8px;font:700 15px var(--t);color:var(--repere)}
ol.der{margin:0;padding:0;list-style:none;counter-reset:e;display:grid;gap:8px}
ol.der li{counter-increment:e;display:grid;grid-template-columns:30px 1fr;gap:10px;font-size:18px;line-height:1.32}
ol.der li::before{content:counter(e);font:800 20px/1 var(--d);font-stretch:75%;width:30px;height:30px;border-radius:50%;background:var(--sol);display:grid;place-items:center}
.texte{font-size:18px;line-height:1.4;margin:0}
.texte p{margin:0 0 8px}
.fiche{margin:4px 0 0;font-size:15px;color:var(--repere)}
.org{margin:0;padding-left:20px;font-size:18px;line-height:1.38}
.org li+li{margin-top:5px}
.org b,.roles b{font-weight:700}
.org b{color:var(--encre)}
.etapes{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:8px}
.etapes li{display:grid;grid-template-columns:62px 1fr;gap:12px;align-items:center;background:var(--sol);border-radius:14px;padding:10px 14px;font-size:18px;line-height:1.3}
.etapes li b{font:800 24px/1 var(--d);font-stretch:72%;text-align:right;white-space:nowrap}
.etapes li b.vide{color:var(--repere)}
.aujourdhui{margin-top:12px;padding:12px 14px;border-radius:14px;background:var(--ligne-pale);font-size:17px;line-height:1.38}
.aujourdhui b{color:var(--ligne-fonce)}
.roles{margin-top:12px;background:var(--encre);color:var(--sur-encre);border-radius:16px;padding:14px 18px}
.roles small{display:block;font:700 14px var(--t);opacity:.75;margin-bottom:4px}
.roles p{margin:0;font-size:20px;line-height:1.35}
.reussite{margin:14px 0 0;padding:10px 14px;background:var(--vert-pale);border-radius:12px;font-size:17px}
.reussite b{color:var(--vert)}
.vars{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
@media (max-width:560px){.vars{grid-template-columns:1fr}}
.v{border-radius:14px;padding:10px 12px;border:2px solid;font-size:16.5px;line-height:1.3}
.v b{display:flex;align-items:center;gap:8px;font:800 20px/1 var(--d);font-stretch:76%;margin-bottom:6px}
.v b i{font-style:normal;width:26px;height:26px;border-radius:7px;display:grid;place-items:center;color:var(--sur-encre);font:800 20px/1 var(--d)}
.fixe{margin-top:10px;padding:10px 14px;border-radius:14px;border:2px dashed var(--repere);font-size:16.5px;line-height:1.35}
.fixe b{display:block;font:800 19px/1.1 var(--d);font-stretch:76%;margin-bottom:4px}
.v.m{border-color:var(--facile);background:var(--facile-pale)}.v.m i{background:var(--facile)}
.v.p{border-color:var(--dur);background:var(--dur-pale)}.v.p i{background:var(--dur)}
.lance{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.lance .go{flex:1 1 220px;min-height:64px;font-size:21px}
.revoir{margin-top:14px}
.revoir summary{cursor:pointer;font:700 15px var(--t);color:var(--repere);min-height:36px;display:flex;align-items:center}
.cote{display:flex;flex-direction:column;gap:14px;min-width:0}
.boite{background:var(--craie);border-radius:22px;padding:16px 18px}
.boite h2{margin:0 0 8px;font:700 15px var(--t);color:var(--repere)}
.boite ul{margin:0;padding-left:20px;font-size:17px;line-height:1.35}
.boite li+li{margin-top:6px}
.cap{font-size:15px;color:var(--repere);margin:8px 0 0}
.ensuite{border:2px dashed var(--trait);border-radius:18px;padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.ensuite div{flex:1;min-width:0}
.ensuite .bt{border:2px solid var(--trait);background:var(--craie);min-height:42px}
.ensuite small{display:block;font:700 14px var(--t);color:var(--repere)}
.ensuite b{font:800 23px/1.05 var(--d);font-stretch:74%}
.fin-txt{font-size:18px}
.note{width:100%;min-height:96px;border:2px solid var(--trait);border-radius:12px;padding:10px 12px;font:17px/1.4 var(--t);color:var(--encre);background:var(--craie);resize:vertical}
.case{display:flex;align-items:center;gap:10px;font-size:17px;margin:10px 0}
.case input{width:26px;height:26px;accent-color:var(--encre)}

/* ---- schémas : repris de l'outil complet, sur une feuille claire (couleurs fixes) ---- */
.schema,.legende-o{
  --bg:#f2f4f7; --surface:#ffffff; --surface-2:#e8edf3; --fg:#14202e; --muted:#566476; --line:#ccd5df;
  --court:#2e7d57; --court-line:#ffffff; --net:#14202e;
  --accent:#1f4fa8; --accent-fg:#ffffff; --ball:#d18a00; --team-b:#c2410c; --team-n:#6b7787;
  --ok:#1f7a4d; --ok-bg:#dff3e8; --warn:#9a5b00; --warn-bg:#fdf0d5; --done:#6b7787; --done-bg:#e6eaef;
  --cy-p:#7a3db8; --cy-p-bg:#f1e8fb; --cy-t:#1f4fa8; --cy-t-bg:#e3ebf8;
  --font-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --font-body:"Source Sans 3","Segoe UI",Roboto,Arial,sans-serif;
;--bg:#fff;--surface:#fff;--surface-2:#eef1f5;--fg:#111;--muted:#444;--line:#999;--track:#c8553d;--track-line:#ffffff;--grass:#3f8f5c;--plot10:#ffffff;--plot25r:#e5484d;--plot50:#f2c200;--cy-s:#0f7a62;--cy-s-bg:#dcf2ea;--sport:#f59e0b}
.schema{background:#fff;color:#14202e;border-radius:14px;padding:8px;font-family:var(--t)}
.schema svg{display:block;width:100%;height:auto;overflow:visible}
.legende-o{margin:8px 4px 0;font-size:14px;color:var(--repere)}.legende-o .legend{display:flex;flex-wrap:wrap;gap:4px 14px}
.legende-o i{display:inline-block;vertical-align:middle;margin-right:4px}.legende-o .dot{width:12px;height:12px;border-radius:50%}
.legende-o .lineb{width:22px;border-top:2px dashed currentColor}.legende-o .liner{width:22px;border-top:2px solid currentColor}
.schema .legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted);margin-top:4px}
.schema .legend i{display:inline-block;vertical-align:middle;margin-right:4px}
.schema .dot{width:10px;height:10px;border-radius:50%}
.schema .liner{width:22px;border-top:2px solid var(--fg)}
.schema .c-pa{fill:var(--accent)}
.schema .c-pb{fill:var(--team-b)}
.schema .c-pn{fill:var(--team-n)}
.schema .c-pt{fill:#ffffff;font:700 12px var(--font-body);text-anchor:middle;dominant-baseline:central}
.schema .c-head-r{fill:var(--fg)}
.schema .teq-sch .c-pt{font-size:20px}
.schema .legend{display:none}
.schema .legend{font-size:7.5pt}
.schema .c-head-o{fill:var(--team-b)}
.schema .lineo{width:22px;border-top:2px dashed var(--ball)}
.schema .p-grass{fill:var(--grass)}
.schema .p-track{fill:none;stroke:var(--track)}
.schema .p-lane{fill:none;stroke:var(--track-line);stroke-width:.8;opacity:.55}
.schema .p-lane.e{stroke-width:1.6;opacity:.9}
.schema .p-finish{stroke:#fff;stroke-width:4}
.schema .p-c10{fill:var(--plot10);stroke:#555;stroke-width:.6}
.schema .p-c25{fill:var(--plot50);stroke:#333;stroke-width:.6}
.schema .p-c25b{fill:var(--plot25r)}
.schema .p-c50{fill:var(--plot50);stroke:#333;stroke-width:.7}
.schema .p-cup{fill:#ff8c1a;stroke:#fff;stroke-width:1}
.schema .p-cone{fill:#1f6feb;stroke:#fff;stroke-width:1}
.schema .p-cone.o{fill:#ff8c1a}
.schema .p-cone.r{fill:#e5484d}
.schema .p-cone.g{fill:#7a3db8}
.schema .p-run{fill:none;stroke:var(--fg);stroke-width:2.4}
.schema .p-run.o{stroke:var(--team-b);stroke-dasharray:6 4}
.schema .p-run.b{stroke:#1f6feb}
.schema .p-head-b{fill:#1f6feb}
.schema .p-seg{fill:none;opacity:.55;stroke:#ffd166}
.schema .p-seg.blue{stroke:#5aa9ff}
.schema .p-seg.vio{stroke:#c39bf0}
.schema .p-seg.red{stroke:#ff6b6b}
.schema .p-zone{fill:none;opacity:.9}
.schema .p-zone.z1{stroke:#e5484d}
.schema .p-zone.z2{stroke:#f2c200}
.schema .p-zone.z3{stroke:#8fd16a}
.schema .p-zone.z4{stroke:#16a34a}
.schema .p-zt{fill:#111;font:700 10px var(--font-body)}
.schema .p-lab{fill:var(--fg);font:600 11.5px var(--font-body)}
.schema .p-lab.w{fill:#fff}
.schema .p-lab.big{font:700 13px var(--font-body)}
.schema .p-small{fill:var(--fg);font:600 10px var(--font-body)}
.schema .p-pt{font-size:10.5px}
.schema .p-grass,.schema .p-track,.schema .p-zone,.schema .p-seg{-webkit-print-color-adjust:exact;print-color-adjust:exact}

/* ---- barre du bas, à portée de pouce ---- */
.pouce{position:fixed;left:0;right:0;bottom:0;display:flex;align-items:center;gap:10px;padding:10px 18px;padding-bottom:max(12px,env(safe-area-inset-bottom));background:color-mix(in srgb,var(--sol) 94%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-top:1px solid var(--trait)}
.pouce .info{flex:1;min-width:0;font-size:15px;color:var(--repere);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pouce .info b{color:var(--encre)}
.pouce .info b.retard{color:var(--alerte)}

/* ---- panneaux ---- */
.voile{position:fixed;inset:0;background:rgba(23,32,51,.45);z-index:20}
.panneau{position:fixed;top:0;bottom:0;width:min(700px,100%);background:var(--sol);z-index:21;display:flex;flex-direction:column;box-shadow:0 0 40px rgba(23,32,51,.25)}
.panneau.droite{right:0}.panneau.gauche{left:0}
.ph{display:flex;align-items:center;gap:12px;padding:14px 20px;padding-top:max(14px,env(safe-area-inset-top));background:var(--craie)}
.ph h2{margin:0;flex:1;font:800 30px/1 var(--d);font-stretch:72%}
.pc{flex:1;overflow:auto;padding:14px 20px 30px;-webkit-overflow-scrolling:touch}
.alerte{padding:12px 14px;border-radius:14px;background:var(--alerte-pale);margin-bottom:12px}
.alerte p{margin:0 0 8px;font-size:17px}
.alerte p b{color:var(--alerte)}
.alerte .bt{border:2px solid var(--alerte);color:var(--alerte);background:var(--craie);min-height:42px;font-size:15px;margin:0 6px 6px 0}
.alerte.ok{background:var(--vert-pale)}.alerte.ok p{margin:0}.alerte.ok b{color:var(--vert)}
.ligneA{display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center;background:var(--craie);border-radius:16px;padding:10px 12px;margin-bottom:8px;border-left:8px solid var(--trait)}
.ligneA.now{border-left-color:var(--ligne)}
.ligneA.fait{opacity:.55}
.ligneA.zap{background:transparent;border:2px dashed var(--trait);border-left-width:8px}
.ligneA.zap .nom{text-decoration:line-through;color:var(--repere)}
.nom{font:800 21px/1.05 var(--d);font-stretch:74%;min-width:0}
.nom small{display:block;font:400 14px var(--t);color:var(--repere);margin-top:3px}
.pas{display:flex;align-items:center;border-radius:12px;background:var(--sol)}
.pas button{width:46px;height:46px;font:700 24px var(--t)}
.pas span{min-width:56px;text-align:center;font:800 23px/1 var(--d);font-stretch:72%}
.pas span em{display:block;font:700 12px var(--t);font-style:normal;color:var(--ligne-fonce)}
.act{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px}
.act .bt{min-height:40px;font-size:14px;padding:0 12px;background:var(--sol)}
.act .bt.on{background:var(--encre);color:var(--sur-encre)}
.ajout{display:flex;gap:8px;margin:6px 0 4px}
.ajout .bt{flex:1;border:2px dashed var(--repere);min-height:50px}
.aide{color:var(--repere);font-size:14px;margin:10px 0 0}
.report{display:flex;align-items:center;gap:10px;background:var(--ligne-pale);border-radius:14px;padding:10px 12px;margin-bottom:10px;font-size:16px}
.report div{flex:1}
.reglages{margin-top:18px;background:var(--craie);border-radius:14px;padding:4px 14px}
.cy{display:flex;gap:8px;margin-bottom:12px}
.cy button{padding:9px 16px;border-radius:10px;font:700 16px var(--t);background:var(--craie)}
.cy button.on{background:var(--encre);color:var(--sur-encre)}
.cy button[data-cy=s].on{background:var(--c-s);color:var(--sur-niv)}.pc.niv-s .sc.jour{outline-color:var(--c-s)}.pc.niv-s{--nivp:var(--c-s)}
.cy button[data-cy=t].on{background:var(--c-t);color:var(--sur-niv)}.pc.niv-t .sc.jour{outline-color:var(--c-t)}.pc.niv-t{--nivp:var(--c-t)}
.pc .sc{border-left:6px solid var(--nivp,var(--trait))}
.grilleS{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:560px){.grilleS{grid-template-columns:1fr}}
.sc{background:var(--craie);border-radius:16px;padding:10px 14px;text-align:left;display:grid;grid-template-columns:auto 1fr;gap:2px 12px;align-items:start}
.sc .n{grid-row:span 3;font:800 30px/.95 var(--d);font-stretch:66%;min-width:52px;white-space:nowrap}
.sc h3{margin:0;font:800 19px/1.05 var(--d);font-stretch:76%}
.sc .et{font-size:13px;color:var(--repere)}
.sc .et b{color:var(--vert)}
.sc .mini{display:flex;gap:2px;height:6px;margin-top:6px}
.sc .mini i{background:var(--trait);border-radius:2px}
.sc.fait .n{color:var(--repere)}
.sc.jour{outline:4px solid var(--ligne);outline-offset:-4px}
.sc.jour .et b{color:var(--ligne-fonce)}
.sc.ouverte{background:var(--ligne-pale)}
.sc.eval{border:2px dashed var(--repere);background:transparent}
.choix{display:grid;gap:8px}
.choix button{background:var(--craie);border-radius:14px;padding:10px 14px;text-align:left}
.choix button b{display:block;font:800 19px/1.1 var(--d);font-stretch:76%}
.choix button span{font-size:14px;color:var(--repere)}
.choix h3{margin:12px 0 2px;font:700 15px var(--t);color:var(--repere)}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--encre);color:var(--sur-encre);padding:10px 16px;border-radius:12px;font-size:16px;z-index:40;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){.panneau.droite{animation:dr .18s ease-out}.panneau.gauche{animation:ga .18s ease-out}@keyframes dr{from{transform:translateX(40px);opacity:.6}}@keyframes ga{from{transform:translateX(-40px);opacity:.6}}}
@media (max-width:560px){.pouce .info{display:none}.barre .titre{display:none}}
@media print{.pouce,.barre .bt{display:none}}

/* ---- Outils : l'outil complet s'ouvre par-dessus l'écran de cours ; le minuteur continue ---- */
.og{font:700 14px var(--t);text-transform:uppercase;letter-spacing:.06em;color:var(--repere);margin:20px 0 8px}
.og:first-child{margin-top:0}
.tuiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.tuiles button{background:var(--craie);border-radius:16px;padding:14px 16px;text-align:left;min-height:82px;border:2px solid transparent}
.tuiles button:active{border-color:var(--ligne)}
.tuiles button b{display:block;font:800 21px/1.1 var(--d);font-stretch:76%}
.tuiles button span{display:block;margin-top:4px;font-size:14px;line-height:1.25;color:var(--repere)}
.outil-v{position:fixed;inset:0;z-index:60;background:var(--sol);display:flex;flex-direction:column}
.outil-v .oh{display:flex;align-items:center;gap:14px;padding:10px 18px;padding-top:max(10px,env(safe-area-inset-top));background:var(--craie);border-bottom:6px solid var(--ligne)}
.outil-v .oh b{flex:1;min-width:0;font:800 21px/1.1 var(--d);font-stretch:74%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.outil-v .ot{font:700 17px var(--t);color:var(--repere);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:45%}
.outil-v iframe{flex:1;width:100%;border:0;background:#fff}
body.sous-outil{overflow:hidden}
@media (max-width:560px){.outil-v .ot{display:none}}

.racc{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 2px}.racc .bt{min-height:44px}
</style>
</head>
<body>
<header class="barre">
  <img src="icon-192.png" alt="">
  <div class="app">Demi-fond<small>Lycée Pompidou</small></div>
  <span class="pastille-niv" id="cyPast">2de</span>
  <div class="titre" id="titre"></div>
  <a class="bt clair" id="prep" href="cycle-demi-fond-old.html">Préparer</a>
</header>
<div class="trace"></div>
<div class="niveau" id="niveau"></div>
<section class="deroule" id="deroule" aria-label="Déroulé de la séance"></section>
<main class="zone" id="zone"></main>
<footer class="pouce">
  <button class="bt bord" id="btSeances" type="button">‹ Séances</button>
  <button class="bt bord" id="btOutils" type="button">Outils</button>
  <button class="bt bord" id="btAjuster" type="button">Ajuster le déroulé</button>
  <div class="info" id="info"></div>
</footer>
<div id="couche"></div>

<script src="demi-fond-donnees.js"></script>
<script>
'use strict';
globalThis.COURT_PR=0.42; /* joueurs dessinés plus gros sur l'écran terrain */
/* ================== Données ================== */
const OLD='cycle-demi-fond-old.html';
const NIV={s:{label:'Seconde',court:'2de',long:'SECONDE',L:SESSIONS},t:{label:'Terminale',court:'Tle',long:'TERMINALE',L:T_SESSIONS}};
const ORDRE=Object.keys(NIV);
const CYC=Object.fromEntries(ORDRE.map(k=>[k,{label:NIV[k].label,L:NIV[k].L}]));
const lienOld=(c,id)=>OLD+'#'+c+'-'+id;
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const lire=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}};
const ecrire=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const auj=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const sea=(c,id)=>(CYC[c]||CYC.t).L.find(s=>s.id===id);
const exDe=r=>{const s=sea(r.c,r.id);return s&&s.ex?s.ex[r.i]:null};
function exListe(s){if(!s||!s.ex||!s.tl)return [];if(Array.isArray(s.ex))return s.ex.map((e,i)=>({e,i,d:s.tl[i+1]?+s.tl[i+1][1]:15,l:s.tl[i+1]?s.tl[i+1][0]:e.t}));return s.tl.filter(t=>t[2]!=='warm'&&t[2]!=='bilan'&&s.ex[t[2]]).map(t=>({e:s.ex[t[2]],i:t[2],d:+t[1],l:t[0]}))}
const aEx=s=>exListe(s).length>0;
/* séance du jour : celle marquée dans l'outil complet (même appareil) */
const CUR=Object.assign(Object.fromEntries(ORDRE.map(k=>[k,''])),(()=>{try{return JSON.parse(localStorage.getItem('df2-cur2')||'{}')}catch(e){return {}}})());

function plan(c,id){
  const s=sea(c,id);if(!s||!s.tl||!s.ex)return [];
  let b;
  if(s.tl.some(t=>t.length>2)){
    b=s.tl.map(t=>{const key=t[2],dur=+t[1];
      if(key==='warm')return {k:'warm',label:t[0],dur};
      if(key==='bilan')return {k:'bilan',label:t[0],dur};
      return {k:'ex',ref:{c,id,i:key},label:t[0],dur}});
  } else {
    b=[{k:'warm',label:s.tl[0][0],dur:+s.tl[0][1]}];
    s.ex.forEach((e,i)=>{const t=s.tl[i+1];if(t&&!(i+1===s.tl.length-1&&/^Bilan/.test(t[0])))b.push({k:'ex',ref:{c,id,i},label:t[0],dur:+t[1]})});
    const last=s.tl[s.tl.length-1];b.push({k:'bilan',label:last[0],dur:+last[1]});
  }
  return b.map(x=>(x.orig=x.dur,x.st='todo',x));
}
/* L'état du jour : valable pour cette séance, ce jour-là seulement. */
let J=lire('dq-jour',null);
function nouveau(c,id){J={date:auj(),c,id,blocks:plan(c,id),cur:0,vu:null,started:null,bt:null,pausedAt:null,pauseMs:0,fin:null,son:J?J.son!==false:true};
  const att=J.blocks.reduce((a,b)=>a+b.dur,0);J.cible=att;sauver()}
function sauver(){ecrire('dq-jour',J)}
function seanceDuJour(){const c=CUR['s']?'s':(ORDRE.find(k=>CUR[k])||'s');return {c,id:CUR[c]||CYC[c].L[0].id}}
if(!J||J.date!==auj()||!CYC[J.c]||!sea(J.c,J.id)){const d=seanceDuJour();nouveau(d.c,d.id)}
if(J.son===undefined)J.son=true;

/* ================== Temps ================== */
const hm=ms=>{const d=new Date(ms);return d.getHours()+' h '+String(d.getMinutes()).padStart(2,'0')};
const mmss=s=>{const a=Math.abs(Math.round(s));return Math.floor(a/60)+':'+String(a%60).padStart(2,'0')};
function horaires(){
  const now=Date.now(),out=[];let t=null;
  J.blocks.forEach((b,i)=>{
    if(b.st==='zap'){out.push(null);return}
    if(b.st==='done'){out.push({s:b.s,e:b.e});t=b.e;return}
    if(i===J.cur&&J.bt){const p=J.pauseMs+(J.pausedAt?now-J.pausedAt:0);const e=J.bt+b.dur*60000+p;out.push({s:J.bt,e});t=Math.max(e,now);return}
    const s=Math.max(t||now,now);const e=s+b.dur*60000;out.push({s,e});t=e;
  });
  return out;
}
function restant(){const b=J.blocks[J.cur];if(!b||!J.bt)return null;const now=Date.now();const p=J.pauseMs+(J.pausedAt?now-J.pausedAt:0);return (J.bt+b.dur*60000+p-now)/1000}
function finPrevue(){const h=horaires().filter(Boolean);return h.length?h[h.length-1].e:null}
function retardMin(){if(!J.started)return 0;const f=finPrevue();return Math.round((f-(J.started+J.cible*60000))/60000)}

/* ================== Schéma ================== */
function schemaDe(e){if(!e||!e.sch||!SCH[e.sch])return '';const sp=SCH[e.sch];return `<div class="schema">${piste(sp)}</div><div class="legende-o">${LEGEND}</div>${sp.cap?`<p class="cap">${sp.cap}</p>`:''}`}

/* ================== Textes : échauffement, organisation ================== */
// Repères chiffrés en gras : on les trouve d'un coup d'œil.
function grasChiffres(t){return esc(t).replace(/(\d+(?:,\d+)?(?:\s?[×x]\s?\d+(?:,\d+)?)?(?:\s?(?:m|min|s|fois|ballons?|équipes?|terrains?|services?|séries?|joueurs?|réceptionneurs?|passeurs?|tours?|points?))?)(?![\w’])/g,'<b>$1</b>')}
function phrases(t){return String(t||'').split(/(?<=[.;])(?<!(?:^|[\s(])[A-ZÀ-Ý]\.)\s+(?=[A-ZÀ-Ý0-9«(])/).map(x=>x.replace(/[;]$/,'').trim()).filter(Boolean)}
function orgHTML(t){const p=phrases(t);return p.length>1?`<ul class="org">${p.map(x=>`<li>${grasChiffres(x)}</li>`).join('')}</ul>`:`<p class="texte">${grasChiffres(t)}</p>`}
function etapesEchauff(s,b){
  const brut=String(s.warm||'').replace(/<a [^>]*>.*?<\/a>/g,'').replace(/<[^>]+>/g,'').trim();
  return `<div style="margin-top:14px">${orgHTML(brut)}</div>`;
}

/* ================== Rendu ================== */
const $=id=>document.getElementById(id);
function exDuBloc(b){return b&&b.k==='ex'?exDe(b.ref):null}
function titreBloc(b){return b.label}
const norm=t=>String(t||'').toLowerCase().replace(/^fil rouge \d+\s*·\s*/,'').replace(/[^a-z0-9àâäéèêëïîôöùûüç]+/g,' ').trim();
function texteChaud(html){return String(html||'').replace(/<a [^>]*data-go="(\w+)"[^>]*>(.*?)<\/a>/g,(m,go,t)=>`<a href="${OLD}" data-ov="${go}">${t}</a>`)}

function rendre(){
  const s=sea(J.c,J.id);
  ORDRE.forEach(k=>document.body.classList.toggle('niv-'+k,J.c===k));
  $('cyPast').textContent=NIV[J.c].court;
  const L=CYC[J.c].L,ij=L.findIndex(x=>x.id===CUR[J.c]);
  $('niveau').innerHTML=`<span class="nn">${NIV[J.c].long}</span><nav class="strip" aria-label="Séances du cycle">${L.map((x,k)=>{
      const cl=[x.id===J.id?'ici':'',x.evalPage?'eval':'',ij>=0&&k<ij?'fait':'',k===ij?'jour':''].filter(Boolean).join(' ');
      return `<button type="button" class="${cl}" data-seance="${x.id}" title="${esc(x.n+' · '+x.title)}"${x.id===J.id?' aria-current="true"':''}>${esc(x.n.replace(' bis','b'))}</button>`}).join('')}</nav>${ORDRE.length>1?`<button type="button" class="bascule" data-act="niv">${NIV[ORDRE[(ORDRE.indexOf(J.c)+1)%ORDRE.length]].label} ›</button>`:''}`;
  const ici=$('niveau').querySelector('.ici');if(ici)ici.scrollIntoView({block:'nearest',inline:'center'});
  $('titre').textContent=s?s.n+' · '+s.title:'';
  $('prep').href=lienOld(J.c,J.id);
  rendreDeroule();rendreZone();rendreInfo();
}
function rendreDeroule(){
  const h=horaires(),vu=J.vu!=null?J.vu:J.cur;
  const vis=J.blocks.map((b,i)=>({b,i})).filter(x=>x.b.st!=='zap'||true);
  let l='',t='';
  vis.forEach(({b,i})=>{
    const cls=b.st==='done'?'fait':b.st==='zap'?'zap':i===J.cur?'now':'';
    const w=b.st==='zap'?3:b.dur;
    l+=`<button type="button" style="flex:${w}" class="${cls}${i===vu?' vu':''}" data-voir="${i}" aria-label="${esc(b.label)}"></button>`;
    const d=b.dur-b.orig,mod=b.st!=='zap'&&d?`<span class="modif${d<0?' moins':''}" style="display:inline-block">${d>0?'+':'−'}${Math.abs(d)}</span>`:'';
    const heure=b.st==='zap'?'zappé':(J.started&&h[i]?hm(h[i].s):b.dur+' min');
    t+=`<button type="button" style="flex:${w}" class="${cls}" data-voir="${i}"><b>${heure}${mod}</b><span>${esc(b.label)}</span></button>`;
  });
  let cur='';
  if(J.started&&!J.fin){const tot=h.filter(Boolean),deb=J.started,fin=tot.length?tot[tot.length-1].e:deb;
    // position du curseur : proportionnelle au temps dans le bloc en cours, sur la largeur dessinée
    const ws=J.blocks.map(b=>b.st==='zap'?3:b.dur),W=ws.reduce((a,b)=>a+b,0);
    let acc=0;for(let i=0;i<J.cur;i++)acc+=ws[i];
    const r=restant(),b=J.blocks[J.cur];let frac=0;if(b&&J.bt&&r!=null)frac=Math.min(1,Math.max(0,1-r/(b.dur*60)));
    const pos=(acc+frac*(ws[J.cur]||0))/W*100;
    const k=pos<6?Math.max(4,pos*50/6):pos>94?100-Math.max(4,(100-pos)*50/6):50;
    cur=`<div class="curseur" style="left:calc(18px + (100% - 36px) * ${pos/100});--k:${k.toFixed(1)}">${hm(Date.now())}</div>`;}
  $('deroule').innerHTML=cur+`<div class="ligneT">${l}</div><div class="blocs">${t}</div>`;
}
function variables(e){
  if(e&&e.fixe&&!(e.moins||e.plus))return `<div class="fixe"><b>Pas de variable.</b> ${esc(e.fixe)}</div>`;
  if(!e||!(e.moins||e.plus))return '';
  return `<div class="vars">${e.moins?`<div class="v m"><b><i>−</i>Plus facile</b>${esc(e.moins)}</div>`:''}${e.plus?`<div class="v p"><b><i>+</i>Plus difficile</b>${esc(e.plus)}</div>`:''}</div>`;
}
function suivantDe(i){for(let k=i+1;k<J.blocks.length;k++)if(J.blocks[k].st==='todo')return k;return -1}
function rendreZone(){
  const z=$('zone');
  if(J.fin){z.innerHTML=finHTML();lierFin();return}
  const i=J.vu!=null?J.vu:J.cur,b=J.blocks[i];if(!b){z.innerHTML='';return}
  const e=exDuBloc(b),s=sea(J.c,J.id),h=horaires()[i];
  const apercu=J.vu!=null&&J.vu!==J.cur;
  const enCours=!apercu&&i===J.cur&&!!J.bt;
  const d=b.dur-b.orig;
  const tagMod=d?`<span class="tag${d<0?' moins':''}">${d>0?'rallongé':'raccourci'} de ${Math.abs(d)} min</span>`:'';
  let etiq,quand;
  if(apercu){etiq=b.st==='done'?'Bloc fait':b.st==='zap'?'Bloc zappé':'Aperçu, plus tard';quand=`${b.dur} min${h&&J.started?', vers '+hm(h.s):''}`}
  else if(enCours){etiq='En cours';quand=`Jusqu’à ${hm(h.e)} ${tagMod}`}
  else {etiq=J.started?'À lancer maintenant':'Pour commencer';quand=`${b.dur} min ${tagMod}`}
  let corps='';
  if(b.k==='warm'){corps=etapesEchauff(s,b)}
  else if(b.k==='bilan'){corps=`<h2 class="rub">Bilan avec les élèves</h2><div class="texte"><p>${esc(s.bilan||'Ce qui a progressé, ce qui reste à travailler, ce qui vient la prochaine fois.')}</p></div>`}
  else if(e){
    const avant=!enCours;
    const roles=e.four?`<div class="roles"><small>Rôle de chacun</small><p>${grasChiffres(e.four)}</p></div>`:'';
    const org=`<h2 class="rub">Organisation</h2>${orgHTML(e.disp)}`;
    const der=`<h2 class="rub">Déroulement</h2><ol class="der">${(e.deroul||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ol>`;
    const reus=e.reus?`<p class="reussite"><b>Réussi si</b> ${esc(e.reus)}</p>`:'';
    corps=avant?(org+roles+reus+variables(e)):(der+reus+variables(e)+`<details class="revoir"><summary>Revoir l’organisation</summary>${org.replace('<h2 class="rub">Organisation</h2>','')}${roles}</details>`);
  }
  let ctrl='';
  if(apercu){ctrl=`<div class="lance"><button class="bt noir" type="button" data-act="retour">Revenir au bloc en cours</button>${b.st==='todo'?`<button class="bt clair" type="button" data-act="zap" data-i="${i}">Zapper ce bloc</button>`:''}</div>`}
  else if(enCours){ctrl=`<div class="reglage"><div class="chrono" id="chrono"><span class="num">–</span><small>restantes</small></div><button class="bt jaune" type="button" data-act="plus" data-v="2">+ 2 min</button><button class="bt jaune" type="button" data-act="plus" data-v="5">+ 5 min</button><button class="bt clair" type="button" data-act="pause" id="btPause">Pause</button><button class="bt noir suiv" type="button" data-act="suivant">${suivantDe(i)<0?'Terminer la séance':'Bloc suivant'}</button></div>`}
  else {ctrl=`<div class="lance"><button class="bt noir go" type="button" data-act="go">${J.started?'C’est parti':'Démarrer la séance'}</button><button class="bt clair" type="button" data-act="zap" data-i="${i}">Zapper</button></div>`}
  const carte=`<article class="carte${apercu?' apercu':enCours?'':' attente'}"><p class="etiq"><span class="nv">${NIV[J.c].court}</span>${etiq}</p><h1>${esc(titreBloc(b))}</h1>${e&&norm(e.t)!==norm(b.label)?`<p class="fiche">Fiche : ${esc(e.t)}</p>`:''}<p class="quand">${quand}</p>${enCours?ctrl:''}${raccourcis(b,e)}${corps}${enCours?'':ctrl}</article>`;
  // colonne de droite : schéma, consignes, ensuite
  let cote='';
  if(e){cote+=`<div class="boite"><h2>${esc(e.k||'Schéma')}</h2>${schemaDe(e)||'<p class="cap">Pas de schéma pour cette situation.</p>'}</div>`;
    if(e.cons&&e.cons.length)cote+=`<div class="boite"><h2>Consignes de réalisation</h2><ul>${e.cons.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`}
  const k=suivantDe(apercu?J.cur:i);
  if(!apercu&&k>=0){const nb=J.blocks[k];cote+=`<div class="ensuite"><div><small>Ensuite${J.started&&horaires()[k]?', vers '+hm(horaires()[k].s):''}</small><b>${esc(nb.label)}</b> <span class="cap">${nb.dur} min</span></div><button class="bt clair" type="button" data-act="voir" data-i="${k}">Voir</button><button class="bt clair" type="button" data-act="zap" data-i="${k}">Zapper</button></div>`}
  z.innerHTML=carte+`<aside class="cote">${cote}</aside>`;
  tic();
}
function rendreInfo(){

let bipFait=false;

let ac=null;
function bip(){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();[0,.25].forEach(t=>{const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=880;g.gain.setValueAtTime(.0001,ac.currentTime+t);g.gain.exponentialRampToValueAtTime(.25,ac.currentTime+t+.02);g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+t+.18);o.connect(g).connect(ac.destination);o.start(ac.currentTime+t);o.stop(ac.currentTime+t+.2)})}catch(e){}}
let verrou=null;
async function eveil(){try{if('wakeLock' in navigator&&!verrou&&document.visibilityState==='visible'){verrou=await navigator.wakeLock.request('screen');verrou.addEventListener('release',()=>{verrou=null})}}catch(e){}}

function lancer(){
  const now=Date.now();

  if(J.blocks[J.cur].st!=='todo'){const k=suivantDe(J.cur-1);if(k<0)return;J.cur=k}
  J.bt=now;J.pauseMs=0;J.pausedAt=null;J.vu=null;bipFait=false;sauver();eveil();
  try{ac=ac||new (window.AudioContext||window.webkitAudioContext)()}catch(e){}
  rendre();window.scrollTo({top:0,behavior:'smooth'});
}
function suivant(){
  const now=Date.now(),b=J.blocks[J.cur];
  if(J.pausedAt){J.pauseMs+=now-J.pausedAt;J.pausedAt=null}
  b.st='done';b.s=J.bt;b.e=now;
  const k=suivantDe(J.cur);
  J.bt=null;J.pauseMs=0;J.vu=null;
  if(k<0){J.fin=now;sauver();rendre();return}
  J.cur=k;sauver();rendre();window.scrollTo({top:0,behavior:'smooth'});
}
function zapper(i){const b=J.blocks[i];if(!b||b.st==='done')return;
  if(b.st==='zap'){b.st='todo'}else{if(i===J.cur&&J.bt)return toast('Termine d’abord le bloc en cours, ou passe au suivant.');b.st='zap';if(i===J.cur){const k=suivantDe(i);if(k>=0)J.cur=k}}
  if(J.vu===i)J.vu=null;sauver();rendre();if(panneauOuvert==='ajuster')ouvrirAjuster()}
document.addEventListener('click',ev=>{
  const v=ev.target.closest('[data-voir]');if(v){const i=+v.dataset.voir;J.vu=(i===J.cur)?null:i;rendreDeroule();rendreZone();return}
  const a=ev.target.closest('[data-act]');if(!a)return;
  const act=a.dataset.act,i=+a.dataset.i;
  if(act==='go')lancer();
  else if(act==='suivant')suivant();
  else if(act==='plus'){J.blocks[J.cur].dur+=+a.dataset.v;bipFait=restant()<0;sauver();rendre();toast(`Rallongé de ${a.dataset.v} min`)}
  else if(act==='pause'){const now=Date.now();if(J.pausedAt){J.pauseMs+=now-J.pausedAt;J.pausedAt=null}else J.pausedAt=now;sauver();tic();rendreInfo()}
  else if(act==='retour'){J.vu=null;rendreDeroule();rendreZone()}
  else if(act==='voir'){J.vu=i;rendreDeroule();rendreZone();window.scrollTo({top:0,behavior:'smooth'})}
  else if(act==='zap')zapper(i);
  else if(act==='niv'){const c=ORDRE[(ORDRE.indexOf(J.c)+1)%ORDRE.length];allerA(c,CUR[c]||CYC[c].L[0].id)}
});

$('zone').addEventListener('touchstart',e=>{const t=e.touches[0];x0=t.clientX;y0=t.clientY},{passive:true});

let panneauOuvert=null;

/* --- Ajuster le déroulé --- */
function ouvrirAjuster(){
  panneauOuvert='ajuster';
  const h=horaires(),r=retardMin();
  let al='';
  if(J.started&&r>0){
    const k=suivantDe(J.cur);const futurs=J.blocks.map((b,i)=>({b,i})).filter(x=>x.b.st==='todo'&&x.i!==J.cur);
    const long=futurs.filter(x=>x.b.k==='ex').sort((a,b)=>b.b.dur-a.b.dur)[0];
    const bil=futurs.find(x=>x.b.k==='bilan');
    al=`<div class="alerte"><p>Avec ces changements, la séance finit à <b>${hm(finPrevue())}, ${r} min plus tard que prévu</b>.</p>
     ${long&&long.b.dur-r>=5?`<button class="bt" type="button" data-aj="moins" data-i="${long.i}" data-v="${r}">Retirer ${r} min à « ${esc(long.b.label)} »</button>`:''}
     ${long?`<button class="bt" type="button" data-aj="zap" data-i="${long.i}">Zapper « ${esc(long.b.label)} »</button>`:''}
     ${bil&&bil.b.dur>2?`<button class="bt" type="button" data-aj="moins" data-i="${bil.i}" data-v="${Math.min(r,bil.b.dur-1)}">Raccourcir le bilan de ${Math.min(r,bil.b.dur-1)} min</button>`:''}</div>`;
  } else if(J.started&&r<0){al=`<div class="alerte ok"><p><b>${-r} min d’avance.</b> Tu peux rallonger une situation qui marche.</p></div>`}
  const reps=lire('dq-reports',[]).filter(x=>x.c===J.c&&x.pour===J.id);
  const repH=reps.map((x,k)=>`<div class="report"><div><b>Reporté de ${esc(x.depuis)}</b> : ${esc(x.label)}, ${x.dur} min</div><button class="bt noir" type="button" data-aj="rep" data-k="${k}">Ajouter</button><button class="bt clair" type="button" data-aj="repx" data-k="${k}">Non</button></div>`).join('');
  const lignes=J.blocks.map((b,i)=>{
    const cls=b.st==='done'?'fait':b.st==='zap'?'zap':i===J.cur?'now':'';
    const d=b.dur-b.orig,hh=h[i];
    const sous=b.st==='done'?`fait, ${hm(b.s)} à ${hm(b.e)}`:b.st==='zap'?'zappé':i===J.cur&&J.bt?`en cours, jusqu’à ${hm(hh.e)}`:(J.started&&hh?`${hm(hh.s)} à ${hm(hh.e)}`:'à venir');
    const modif=b.st!=='done';
    return `<div class="ligneA ${cls}"><div class="nom">${esc(titreBloc(b))}<small>${sous}</small></div>
      <div class="pas">${modif?`<button type="button" data-aj="moins" data-i="${i}" data-v="1" aria-label="Une minute de moins">−</button>`:''}<span class="num">${b.dur}′${d?`<em>${d>0?'+':'−'}${Math.abs(d)}</em>`:''}</span>${modif?`<button type="button" data-aj="plus" data-i="${i}" aria-label="Une minute de plus">+</button>`:''}</div>
      ${modif?`<div class="act">${!(i===J.cur&&J.bt)?`<button class="bt${b.st==='zap'?' on':''}" type="button" data-aj="zap" data-i="${i}">${b.st==='zap'?'Rétablir':'Zapper'}</button>`:''}${b.k==='ex'&&!(i===J.cur&&J.bt)?`<button class="bt" type="button" data-aj="remp" data-i="${i}">Remplacer</button>`:''}${i>J.cur&&i>1?`<button class="bt" type="button" data-aj="haut" data-i="${i}">Monter</button>`:''}${i>J.cur&&i<J.blocks.length-2?`<button class="bt" type="button" data-aj="bas" data-i="${i}">Descendre</button>`:''}</div>`:''}</div>`;
  }).join('');
  panneau('droite','Ajuster le déroulé',al+repH+lignes+`<div class="ajout"><button class="bt" type="button" data-aj="ajout">+ Ajouter un exercice d’une autre séance</button></div>
   <p class="aide">Ces changements ne valent que pour la séance d’aujourd’hui. Demain, la séance repart de son plan d’origine.</p>
   <div class="reglages"><label class="case"><input type="checkbox" id="son" ${J.son?'checked':''}> Petit signal sonore en fin de bloc</label></div>
   <p class="aide"><button class="bt clair" type="button" data-aj="reset">Revenir au déroulé d’origine</button></p>`);
  $('son').onchange=e=>{J.son=e.target.checked;sauver()};
}
function deplacer(i,d){const j=i+d;if(j<=J.cur||j<1||j>J.blocks.length-2)return;const t=J.blocks[i];J.blocks[i]=J.blocks[j];J.blocks[j]=t}
document.addEventListener('click',ev=>{
  const a=ev.target.closest('[data-aj]');if(!a)return;
  const act=a.dataset.aj,i=+a.dataset.i,b=J.blocks[i];
  if(act==='plus'){b.dur+=1}
  else if(act==='moins'){b.dur=Math.max(1,b.dur-(+a.dataset.v||1))}
  else if(act==='zap'){zapper(i);return}
  else if(act==='haut')deplacer(i,-1);
  else if(act==='bas')deplacer(i,1);
  else if(act==='remp'){choisirExo(ex=>{b.ref=ex.ref;b.label=ex.label;sauver();ouvrirAjuster();rendre()},'Remplacer « '+b.label+' »');return}
  else if(act==='ajout'){choisirExo(ex=>{const pos=Math.max(J.cur+(J.bt?1:0),1);J.blocks.splice(pos,0,{k:'ex',ref:ex.ref,label:ex.label,dur:ex.dur,orig:ex.dur,st:'todo'});sauver();ouvrirAjuster();rendre()},'Ajouter un exercice');return}
  else if(act==='rep'||act==='repx'){const all=lire('dq-reports',[]),mine=all.filter(x=>x.c===J.c&&x.pour===J.id),x=mine[+a.dataset.k];
    if(act==='rep'){const pos=Math.max(J.cur+(J.bt?1:0),1);J.blocks.splice(pos,0,{k:'ex',ref:x.ref,label:x.label,dur:x.dur,orig:x.dur,st:'todo'})}
    all.splice(all.indexOf(x),1);ecrire('dq-reports',all)}
  else if(act==='reset'){if(!confirm('Revenir au déroulé d’origine ? Les blocs déjà faits restent faits.'))return;
    const p=plan(J.c,J.id);p.forEach((x,k)=>{const old=J.blocks.find(o=>o.st==='done'&&o.k===x.k&&JSON.stringify(o.ref)===JSON.stringify(x.ref));if(old)Object.assign(x,{st:'done',s:old.s,e:old.e})});J.blocks=p;J.cur=Math.max(0,J.blocks.findIndex(x=>x.st==='todo'));J.bt=null}
  sauver();rendre();ouvrirAjuster();
});

function voirOutil(id,auto,titre){
  fermer();
  const v=document.createElement('div');v.className='outil-v';v.setAttribute('role','dialog');v.setAttribute('aria-label',titre);
  v.innerHTML=`<div class="oh"><button class="bt noir" type="button" data-fo>‹ Retour au cours</button><b>${esc(titre)}</b><span class="ot num" id="oTemps"></span></div><iframe title="${esc(titre)}" src="${urlOutil(id,auto)}"></iframe>`;
  document.body.appendChild(v);document.body.classList.add('sous-outil');
  const maj=()=>{const el=$('oTemps');if(!el)return;const r=restant(),b=J.blocks[J.cur];el.textContent=(r==null||J.fin||!b)?'':`${titreBloc(b)} · ${r<0?'+':''}${mmss(r)}`};
  maj();clearInterval(outilTic);outilTic=setInterval(maj,1000);
  v.querySelector('[data-fo]').onclick=fermerOutil;
}
function fermerOutil(){const v=document.querySelector('.outil-v');if(!v)return;v.remove();document.body.classList.remove('sous-outil');clearInterval(outilTic);relireCur();rendre()}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.querySelector('.outil-v'))fermerOutil()});
$('btOutils').onclick=ouvrirOutils;

/* ================== Séance du jour ==================
   Même réglage que dans l'outil complet (« Préparer ») : les deux restent d'accord. */
function marquerJour(c,id){const cur=Object.assign({s:'',t:''},lire('df2-cur2',{}));cur[c]=id;ecrire('df2-cur2',cur);Object.assign(CUR,cur)}
document.addEventListener('click',ev=>{const b=ev.target.closest('[data-jour]');if(!b)return;
  const c=b.dataset.c||J.c,s=sea(c,b.dataset.jour);if(!s)return;marquerJour(c,s.id);toast(`${s.n} est la séance du jour`);
  if(panneauOuvert==='seances')ouvrirSeances();else rendre()});

/* ================== Raccourcis : l'outil dont le bloc a besoin ==================
   Ex. : bloc « montante-descendante » → « Ouvrir le tournoi ». Ouvert par-dessus le cours. */
const RACC=[[/^warm$/,'warm','Échauffement autonome'],[/outil « évaluation »|barème|course [123]\b|épreuve blanche/i,'evalf','Barème et note'],[/tableau d’allures|tableaux d’allures/i,'tables','Tableaux d’allures'],[/vma|plot cible|au plot|allure/i,'calc','Calculette VMA']];
function raccourcis(b,e){
  const typ=b.k==='warm'?'warm':(b.typ||b.k);
  const txt=e?[e.t,e.k,e.disp,e.four,e.cat,e.dispo,e.titre].concat(e.deroul||[]).filter(Boolean).join(' '):'';
  const ids=OUTILS.flatMap(g=>g.items.map(t=>t[0])),vus=new Set(),out=[];
  for(const [re,id,lab,auto] of RACC){if(out.length>=2)break;if(vus.has(id)||!ids.includes(id))continue;
    if(re.test(typ)||(txt&&!/^\^/.test(re.source)&&re.test(txt))){vus.add(id);out.push(`<button class="bt jaune" type="button" data-ov="${id}"${auto?' data-auto="1"':''}>${esc(lab)} ›</button>`)}}
  return out.length?`<div class="racc">${out.join('')}</div>`:'';
}

/* liens du texte (« fiche Échauffements »…) : ouverts par-dessus, comme les outils */
document.addEventListener('click',ev=>{const a=ev.target.closest('[data-ov]');if(!a)return;ev.preventDefault();
  const id=a.dataset.ov,g=OUTILS.find(g=>g.items.some(t=>t[0]===id)),t=g&&g.items.find(t=>t[0]===id);
  voirOutil(id,g?!!g.a:J.c==='a',t?t[1]:a.textContent)});

rendre();
if(J.started&&!J.fin)eveil();
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}
